<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#160b25"><title>Guides GTA 6 — GTA 6 Guide Radar</title><meta name="description" content="Retrouve les guides GTA 6 classés par missions, armes, véhicules, secrets et régions."><style>
:root{--bg:#10091c;--panel:#21142e;--line:#493052;--text:#fff7f7;--muted:#c6b4cc;--pink:#ff78b7;--gold:#ffb35c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#10091c,#1b1129 70%,#111b2a);color:var(--text);font:15px/1.55 system-ui,sans-serif}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}a{color:inherit;text-decoration:none}.nav{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff1a}.brand{font-weight:1000;letter-spacing:1px}.brand em{font-style:normal;color:var(--pink)}.nav a:last-child{color:var(--pink);font-size:12px;font-weight:900}.hero{padding:40px 0 25px}.eyebrow{color:#70d8dc;font-size:10px;font-weight:900;letter-spacing:2px}.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.02;margin:8px 0}.hero p{color:var(--muted);max-width:700px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tools input{flex:1;min-width:230px;background:#21142e;border:1px solid var(--line);border-radius:9px;padding:12px;color:white}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button{border:1px solid #59415e;background:#1c112b;color:#e6d4e9;border-radius:30px;padding:8px 12px;font-size:11px;font-weight:850}.filters button.active{background:#612b58;border-color:var(--pink);color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;padding-bottom:45px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#261632,#191125);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.cover{height:105px;background:linear-gradient(135deg,#5b2d64,#c65c85 55%,#f39a65);display:flex;align-items:end;padding:12px}.cover span,.pill{font-size:9px;font-weight:900;letter-spacing:.7px;background:#150d24d9;padding:5px 8px;border-radius:20px}.body{padding:14px;display:flex;flex-direction:column;flex:1}.meta{display:flex;gap:6px;flex-wrap:wrap}.meta span{font-size:9px;background:#462642;color:#e8b9d7;border-radius:20px;padding:4px 7px}.body h2{font-size:17px;lin </style></head><body><header class="wrap nav"><a class="brand" href="/"><em>GTA 6</em> GUIDE RADAR</a><a href="/">← ACCUEIL</a></header><main class="wrap"><section class="hero"><div class="eyebrow">BIBLIOTHÈQUE DU JOUEUR</div><h1 id="heading">Tous les guides GTA 6</h1><p id="intro">Solutions, astuces, lieux, armes et découvertes de Leonida. Chaque fiche conserve sa source et son niveau de vérification.</p><div class="tools"><input id="q" type="search" placeholder="Rechercher un guide, un lieu, une arme…"><div class="filters" id="filters"><button data-cat="all" class="active">Tout</button><button data-cat="mission">Missions</button><button data-cat="base_radar">Bases radar</button><button data-cat="weapon">Armes</button><button data-cat="vehicle">Véhicules</button><button data-cat="collectible">Secrets</button><button data-cat="region">Régions</button><button data-cat="tip">Astuces</button></div></div><p id="count" class="eyebrow"></p></section><section class="grid" id="grid"><div class="empty">Chargement des guides…</div></section></main><footer><div class="wrap">GTA 6 GUIDE RADAR · Site indépendant, non affilié à Rockstar Games.</div></footer><script>
const $=s=>document.querySelector(s);let all=[],cat=new URLSearchParams(location.search).get("category")||"all";const names={all:"Tous les guides GTA 6",mission:"Solutions de missions",base_radar:"Bases radar et opérations",weapon:"Armes et équipements",vehicle:"Véhicules",collectible:"Secrets et objets à collectionner",region:"Régions de Leonida",tip:"Astuces GTA 6"};$("#heading").textContent=names[cat]||names.all;function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}function render(){let q=$("#q").value.toLowerCase().trim();let rows=all.filter(x=>(cat==="all"||x.category===cat)&&(!q||(x.title+" "+x.summary+" "+(x.region||"")).toLowerCase().includes(q)));$("#count").textContent=rows.length+" fiche(s) disponibles";$("#grid").innerHTML=rows.length?rows.map(x=>'<article class="card"><div class="cover"><span>'+esc(x.category.replace("_"," ").toUpperCase())+' · '+(x.status==="verified"?"VÉRIFIÉ":"À VÉRIFIER")+'</span></div><div class="body"><div class="meta"><span>'+esc(x.region||"Leonida")+'</span><span>'+esc(x.source_label||"Source")+'</span></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.summary)+'</p><a href="/guide.html?slug='+encodeURIComponent(x.slug)+'">OUVRIR LE GUIDE ↗</a></div></article>').join(""):'<div class="empty">Aucun guide ne correspond à cette recherche. Les nouvelles fiches apparaîtront ici après validation.</div>';document.querySelectorAll("[data-cat]").forEach(b=>b.classList.toggle("active",b.dataset.cat===cat));}$("#filters").addEventListener("click",e=>{let b=e.target.closest("[data-cat]");if(!b)return;cat=b.dataset.cat;history.replaceState(null,"","?category="+encodeURIComponent(cat));$("#heading").textContent=names[cat];render()});$("#q").addEventListener("input",render);fetch("/api/guide/entries").then(r=>r.json()).then(d=>{all=d.items||[];render()}).catch(()=>{$("#grid").innerHTML='<div class="empty">La bibliothèque est momentanément indisponible.</div>'});
</script></body></html>
