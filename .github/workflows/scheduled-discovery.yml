name: GTA 6 Radar scheduled discovery

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger protected source discovery
        env:
          GTA6_ADMIN_TOKEN: ${{ secrets.GTA6_ADMIN_TOKEN }}
        run: |
          if [ -z "${GTA6_ADMIN_TOKEN}" ]; then
            echo "Secret GTA6_ADMIN_TOKEN absent : collecte ignorée."
            exit 0
          fi
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GTA6_ADMIN_TOKEN}" \
            --header "Content-Type: application/json" \
            https://gta6-guide-radar.onrender.com/api/robot/discover
