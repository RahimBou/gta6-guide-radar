name: Validate GTA 6 Guide Radar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python syntax and database smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q gta6radar
      - name: Database initialization smoke test
        run: |
          GTA6_DATA_DIR="$RUNNER_TEMP/gta6-test-data" python -c "from gta6radar.db import connect, DB_PATH; c=connect(); names={r[0] for r in c.execute('SELECT name FROM sqlite_master WHERE type=\\'table\\'')}; required={'robot_videos','robot_jobs','robot_evidence','robot_tips','items','guide_entries','map_markers'}; assert required <= names, required - names; c.close(); print('SQLite schema OK:', DB_PATH)"
